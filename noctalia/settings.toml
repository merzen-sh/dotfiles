[theme]
community_palette = "Vesper"
custom_palette = "everforest-wallpapers-for-arch-linux-by-deviantarchuser-dhl7jc5-pre-vib"
source = "community"
wallpaper_scheme = "vibrant"

    [theme.templates]
    builtin_ids = [ "btop", "gtk3", "gtk4", "hyprland", "kitty", "qt", "starship" ]
    community_ids = [
        "antigravity",
        "codex",
        "opencode",
        "pi-agent",
        "discord",
        "neovim",
        "obsidian",
        "vscode",
        "zed",
        "prismlauncher",
        "fastfetch",
        "obs",
        "bat",
        "fzf",
        "lazygit"
    ]

[wallpaper]
directory = "/home/mark/Wallpapers"
fill_mode = "stretch"

    [wallpaper.default]
    path = "/home/mark/Wallpapers/nord/an_astronaut_in_space_with_a_satellite.png"

    [wallpaper.last]
    path = "/home/mark/Wallpapers/nord/an_astronaut_in_space_with_a_satellite.png"

    [wallpaper.monitors.DP-1]
    path = "/home/mark/Wallpapers/nord/an_astronaut_in_space_with_a_satellite.png"

    [wallpaper.monitors.HDMI-A-1]
    path = "/home/mark/Wallpapers/nord/an_astronaut_in_space_with_a_satellite.png"

[widget.launcher]
