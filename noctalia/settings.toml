config_version = 13

[bar.default]
capsule_thickness = 0.99999998137354851
center = [ "clock", "spacer_2", "group:g2", "spacer_2", "group:g1" ]
end = [
    "tray",
    "notifications",
    "clipboard",
    "keyboard_layout",
    "network",
    "volume",
    "brightness",
    "control-center",
    "session"
]
font_family = "JetBrains Mono Light"
margin_edge = 7
margin_ends = 8
padding = 15
radius = 8
show_on_workspace_switch = false
start = [ "launcher", "wallpaper", "spacer_2", "workspaces", "spacer_2", "active_window", "spacer_2", "media" ]

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    enabled = true
    fill = "surface"
    id = "g1"
    members = [ "network_rx", "network_tx" ]
    opacity = 1.0
    padding = 6.0

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    enabled = true
    fill = "surface_variant"
    id = "g2"
    members = [ "cpu", "ram" ]
    opacity = 1.0
    padding = 6.0

