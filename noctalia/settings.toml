config_version = 16

[bar.default]
background_opacity = 0.4999999888241291
center = [ "clock", "cpu", "ram", "network_rx", "network_tx" ]
font_family = "Adwaita Mono"
margin_edge = 3
margin_ends = 3
padding = 10
radius = 7
shadow = false
start = [ "launcher", "wallpaper", "workspaces", "audio_visualizer", "active_window" ]

