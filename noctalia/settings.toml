[plugins]
enabled = []

[shell]
app_icon_color = "primary"
font_family = "JetBrains Mono Light"
panel_anchor_bar = "default"
settings_show_advanced = true

    [shell.launcher]
    pinned = [ "org.prismlauncher.PrismLauncher" ]

    [shell.panel]
    launcher_placement = "attached"

[theme]
builtin = "Catppuccin"
community_palette = "Peche"
mode = "dark"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "alacritty", "btop", "cava", "gtk3", "gtk4", "ghostty", "hyprland", "kitty", "qt", "starship", "wezterm" ]
    community_ids = [
        "antigravity",
        "opencode",
        "pi-agent",
        "zen-browser",
        "discord",
        "micro",
        "neovim",
        "vscode",
        "zed",
        "prismlauncher",
        "fastfetch",
        "obs",
        "bat",
        "lazygit"
    ]

[wallpaper]
directory = "/home/mark/wallz"
fill_mode = "crop"

    [wallpaper.default]
    path = "/home/mark/wallz/01. Gruvbox Retro.jpg"

    [wallpaper.last]
    path = "/home/mark/wallz/01. Gruvbox Retro.jpg"

    [wallpaper.monitors.DP-1]
    path = "/home/mark/wallz/01. Gruvbox Retro.jpg"

    [wallpaper.monitors.HDMI-A-1]
    path = "/home/mark/wallz/01. Gruvbox Retro.jpg"

    [[wallpaper.favorite]]
    path = "/home/mark/wallz/01. Lucid Aurora.png"
    theme_mode = "auto"

    [[wallpaper.favorite]]
    builtin_palette = "Ayu"
    palette_source = "builtin"
    path = "/home/mark/wallz/13. Graphite Mono.jpg"
    theme_mode = "dark"

[widget.active_window]
icon_size = 20

[widget.clipboard]
enabled = true

[widget.launcher]
glyph = "apps-filled"

[widget.media]
interactive = false
max_length = 200
