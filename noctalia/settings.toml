schema_version = 2
widget_order = [ "lockscreen-login-box@DP-1", "lockscreen-login-box@HDMI-A-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 640.0
    cy = 842.0
    output = "DP-1"
    placement_height = 1024.0
    placement_width = 1280.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-1".settings]
        background_color = "surface_container"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_password_reveal = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 898.0
    output = "HDMI-A-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1".settings]
        background_color = "surface_container"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_password_reveal = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[shell.launcher]
category_icons_only = true
compact = true
search_position = "top"

[shell.panel]
border_width = 0.0
launcher_placement = "attached"

[[shell.session.actions]]
action = "lock"
countdown_seconds = 0.0
enabled = false
shortcut = "1"
variant = "default"

[[shell.session.actions]]
action = "logout"
countdown_seconds = 0.0
enabled = false
shortcut = "2"
variant = "default"

[[shell.session.actions]]
action = "lock_and_suspend"
countdown_seconds = 0.0
enabled = false
shortcut = "3"
variant = "default"

[[shell.session.actions]]
action = "reboot"
countdown_seconds = 0.0
enabled = false
shortcut = "4"
variant = "default"

[[shell.session.actions]]
action = "shutdown"
countdown_seconds = 0.0
enabled = false
shortcut = "5"
variant = "destructive"

[theme]
community_palette = "Vesper"
mode = "dark"
source = "community"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "btop", "gtk3", "gtk4", "hyprland", "kitty", "qt", "starship" ]
    community_ids = [
        "antigravity",
        "claude-code",
        "codex",
        "opencode",
        "discord",
        "neovim",
        "vscode",
        "obs",
        "bat",
        "fzf",
        "lazygit",
        "tmux"
    ]

[wallpaper]
directory = "/home/mark/Wallpapers"

    [wallpaper.default]
    path = "/home/mark/Wallpapers/monochrome/b-067.jpg"

    [wallpaper.last]
    path = "/home/mark/Wallpapers/monochrome/b-067.jpg"

    [wallpaper.monitors.DP-1]
    path = "/home/mark/Wallpapers/monochrome/b-067.jpg"

    [wallpaper.monitors.HDMI-A-1]
    path = "/home/mark/Wallpapers/monochrome/b-067.jpg"

[widget.audio_visualizer]
enabled = false

[widget.launcher]
glyph = "apps-filled"

[widget.media]
enabled = false

[widget.network]
show_label = false

[widget.tray]
drawer = true

[widget.workspaces]
active_pill_size = 1.2
inactive_pill_size = 1.2