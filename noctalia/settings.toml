config_version = 15

[bar.default]
background_opacity = 0.79999998211860657
center = [ "clock", "cpu", "ram", "network_rx", "network_tx" ]
font_family = "Adwaita Mono"
margin_edge = 3
margin_ends = 3
padding = 10
radius = 4
shadow = false
start = [ "launcher", "wallpaper", "workspaces", "audio_visualizer" ]

[location]
auto_locate = true

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@DP-1", "lockscreen-login-box@HDMI-A-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 640.0
    cy = 842.0
    output = "DP-1"
    placement_height = 1024.0
    placement_width = 1280.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_password_reveal = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 898.0
    output = "HDMI-A-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_password_reveal = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[shell.launcher]
category_icons_only = true
search_position = "top"

[shell.panel]
launcher_placement = "attached"

[[shell.session.actions]]
action = "lock"
countdown_seconds = 0.0
enabled = false
shortcut = "1"
variant = "default"

[[shell.session.actions]]
action = "logout"
countdown_seconds = 0.0
enabled = false
shortcut = "2"
variant = "default"

[[shell.session.actions]]
action = "lock_and_suspend"
countdown_seconds = 0.0
enabled = false
shortcut = "3"
variant = "default"

[[shell.session.actions]]
action = "reboot"
countdown_seconds = 0.0
enabled = false
shortcut = "4"
variant = "default"

[[shell.session.actions]]
action = "shutdown"
countdown_seconds = 0.0
enabled = false
shortcut = "5"
variant = "destructive"

[theme]
community_palette = "Vesper"
mode = "dark"
pure_black_dark = true
source = "community"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "btop", "gtk3", "gtk4", "hyprland", "kitty", "qt", "starship" ]
    community_ids = [
        "antigravity",
        "claude-code",
        "codex",
        "opencode",
        "discord",
        "neovim",
        "vscode",
        "obs",
        "bat",
        "fzf",
        "lazygit"
    ]

[wallpaper]
directory = "/home/mark/Wallpapers"

    [wallpaper.default]
    path = "/home/mark/Wallpapers/digital/a_car_in_a_field_with_trees_and_a_fire.png"

    [wallpaper.last]
    path = "/home/mark/Wallpapers/digital/a_car_in_a_field_with_trees_and_a_fire.png"

    [wallpaper.monitors.DP-1]
    path = "/home/mark/Wallpapers/digital/a_car_in_a_field_with_trees_and_a_fire.png"

    [wallpaper.monitors.HDMI-A-1]
    path = "/home/mark/Wallpapers/digital/a_car_in_a_field_with_trees_and_a_fire.png"

[widget.launcher]
glyph = "apps-filled"

[widget.media]
enabled = false