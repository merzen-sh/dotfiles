[config]

[templates]

# OpenCode theme — generated from Noctalia dynamic colors
[templates.opencode]
input_path = "~/.config/noctalia/templates/opencode.json"
output_path = "~/.config/opencode/themes/noctalia.json"

# LazyGit theme — generated from Noctalia dynamic colors
[templates.lazygit]
input_path = "~/.config/noctalia/templates/lazygit.yml"
output_path = "~/.config/lazygit/config.yml"

# FZF theme — generated from Noctalia dynamic colors
[templates.fzf]
input_path = "~/.config/noctalia/templates/fzf.conf"
output_path = "~/.config/fzf/fzfrc"

# Vscode theme — generated from Noctalia dynamic colors
[catalog.vscode]
name = "VSCode"
category = "editor"

[templates.vscode_code]
input_path = "~/.config/noctalia/templates/vscode.json"
output_path = "~/.vscode/extensions/noctalia.noctaliatheme-0.0.5/themes/NoctaliaTheme-color-theme.json"
requires_path = "~/.vscode"

[templates.vscode_codium]
input_path = "~/.config/noctalia/templates/vscode.json"
output_path = "~/.vscode-oss/extensions/noctalia.noctaliatheme-0.0.5-universal/themes/NoctaliaTheme-color-theme.json"
requires_path = "~/.vscode-oss"

[templates.antigravity_ide]
input_path = "~/.config/noctalia/templates/vscode.json"
output_path = "~/.antigravity-ide/extensions/noctalia.noctaliatheme-0.0.5-universal/themes/NoctaliaTheme-color-theme.json"
requires_path = "~/.antigravity-ide"
