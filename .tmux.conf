# =============================================================================
# Prefix
# =============================================================================

unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix


# =============================================================================
# General
# =============================================================================

set -s default-terminal "tmux-256color"

set -g mouse on
set -g base-index 1
set -g renumber-windows on

setw -g pane-base-index 1

set -g status-position top

# Extended keyboard support
set -g extended-keys always


# =============================================================================
# Keybindings
# =============================================================================

# Popup
bind-key f display-popup \
    -E \
    -w 80% \
    -h 80% \
    -d "#{pane_current_path}"

# Pane navigation
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Reload config
bind-key r source-file ~/.tmux.conf \; \
    display-message "tmux config reloaded"


# =============================================================================
# Activity / Bell
# =============================================================================

set -g visual-activity off
set -g visual-bell off
set -g visual-silence off

setw -g monitor-activity off
setw -g bell-action none


# =============================================================================
# Clock
# =============================================================================

setw -g clock-mode-colour yellow


# =============================================================================
# Copy Mode
# =============================================================================

setw -g mode-style "fg=black,bg=cyan,bold"


# =============================================================================
# Pane Borders
# =============================================================================

set -g pane-border-style "fg=cyan"
set -g pane-active-border-style "fg=yellow"


# =============================================================================
# Status Bar
# =============================================================================

set -g status-position top
set -g status-justify left

set -g status-style "fg=cyan,bg=black"

# Left
set -g status-left \
    "#[fg=cyan,bg=black]"

set -g status-left-length 10

# Right
set -g status-right \
    "#[fg=cyan]#[fg=black,bg=cyan] 󱑉 %H:%M"

set -g status-right-length 50


# =============================================================================
# Windows
# =============================================================================

setw -g window-status-format \
    "#[fg=cyan,bg=black]  #I:#W #[fg=black,bg=black]"

setw -g window-status-current-style \
    "fg=black,bg=cyan,bold"

setw -g window-status-current-format \
    "#[fg=cyan,bg=black]#[fg=black,bg=cyan] #I:#W #[fg=cyan,bg=black]"


# =============================================================================
# Messages
# =============================================================================

set -g message-style "fg=cyan,bg=black,bold"


# =============================================================================
# Noctalia Theme
# =============================================================================

if-shell '[ -f "$HOME/.config/tmux/themes/noctalia.conf" ]' \
    'source-file "$HOME/.config/tmux/themes/noctalia.conf"'