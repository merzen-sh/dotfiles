[vars]
DOTFILES_DIR = "{{config_root}}"

[tools]
starship = "latest"
lazygit = "latest"
github-cli = "latest"
neovim = "latest"
btop = "latest"
zoxide = "latest"
go = "latest"
rust = "latest"
uv = "latest"
ruff = "latest"
bun = "latest"
node = "lts"
pnpm = "latest"
eza = "latest"
fzf = "latest"
tmux = "latest"
"cargo:stylua" = "latest"
tombi = "1.5.1"

[tasks.install]
description = "Install and configure the dotfiles environment"
depends = ["link", "git", "wsl", "software", "rust", "pre-commit"]

[tasks.pre-commit]
description = "Format Lua files with StyLua"
run = "stylua ."

[tasks.systemd]
depends = ["systemd"]
